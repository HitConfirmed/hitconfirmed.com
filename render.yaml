# Render Blueprint for Hit Confirmed (internal: MoneyMatch).
#
# Two environments, each one always-on Web Service + its own persistent disk
# holding its own SQLite file:
#   - hit-confirmed-test  TEST site  (hit-confirmed.onrender.com) <- `testing` branch
#   - hit-confirmed-prod  OFFICIAL   (hitconfirmed.com)            <- `main` branch
# Ship to the official site by merging `testing` into `main`.
#
# CRITICAL: each service MUST stay a SINGLE instance. The app relies on an
# in-process write mutex (txn.js), an in-process wallet/bankroll cache, and
# SQLite's single writer to prevent a debit-without-settle money race. Do NOT
# add replicas or autoscaling — attaching the disk already pins it to one
# instance, keep it that way.
#
# Each service has its OWN secrets (entered in the dashboard, never in this
# repo): a separate JWT_SECRET so a test-site login can't be replayed on the
# official site, and a separate STARTGG_API_TOKEN so the test site's pollers
# never eat into the official site's start.gg rate limit.
services:
  - type: web
    name: hit-confirmed-test
    runtime: node
    plan: starter            # $7/mo always-on (free tier sleeps + has no disk)
    region: ohio             # US-East, closest to Ontario
    branch: testing
    # Build the API deps + the React client (force devDeps so react-app-rewired is
    # present, and CI=false so CRA warnings don't fail the build).
    buildCommand: npm install && npm install --prefix client --include=dev && DISABLE_ESLINT_PLUGIN=true CI=false npm run build --prefix client
    startCommand: node server.js
    healthCheckPath: /api/health   # keeps old instance live until new one is ready
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1              # the DB is <50 MB; grow later if ever needed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/database.db
      - key: APP_BASE_URL
        value: https://hit-confirmed.onrender.com
      - key: MAIL_FROM
        value: Hit Confirmed (Test) <no-reply@hitconfirmed.com>
      - key: SMTP_PORT
        value: "587"
      - key: RESET_TOKEN_TTL_MINUTES
        value: "60"
      # Secrets — Render prompts for these on first deploy; never stored in the repo.
      - key: JWT_SECRET
        sync: false
      - key: STARTGG_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Weekly prod -> test DB copy (scripts/db-snapshot.js): pulled from the
      # official service over Render's private network, Mondays 4 AM Toronto.
      - key: DB_SNAPSHOT_SOURCE
        value: http://hit-confirmed-prod:10001/snapshot
      - key: DB_SNAPSHOT_SECRET
        fromService:
          type: web
          name: hit-confirmed-prod
          envVarKey: DB_SNAPSHOT_SECRET
      # Comma-separated emails that keep their real address in the copy (the
      # owner's own account); every other user becomes user-<id>@hitconfirmed.test.
      - key: DB_SNAPSHOT_KEEP_EMAILS
        sync: false

  - type: web
    name: hit-confirmed-prod
    runtime: node
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm install && npm install --prefix client --include=dev && DISABLE_ESLINT_PLUGIN=true CI=false npm run build --prefix client
    startCommand: node server.js
    healthCheckPath: /api/health
    domains:
      - hitconfirmed.com
      - www.hitconfirmed.com
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/database.db
      - key: APP_BASE_URL
        value: https://hitconfirmed.com
      - key: MAIL_FROM
        value: Hit Confirmed <no-reply@hitconfirmed.com>
      - key: SMTP_PORT
        value: "587"
      - key: RESET_TOKEN_TTL_MINUTES
        value: "60"
      - key: JWT_SECRET
        sync: false
      - key: STARTGG_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Serves DB snapshots to the test service on a private-network-only port
      # (Render never routes public traffic to it). Secret is generated by Render
      # and shared with hit-confirmed-test via fromService - never in the repo.
      - key: DB_SNAPSHOT_PORT
        value: "10001"
      - key: DB_SNAPSHOT_SECRET
        generateValue: true
